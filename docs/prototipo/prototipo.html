<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kcal-tracker — prototipo</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --line: #e3e6ea;
    --line-soft: #eef0f3;
    --text: #16191d;
    --text-2: #5b6470;
    --text-3: #8b939e;
    --accent: #2f6fd0;
    --green: #1d7a4f;
    --green-bg: #e8f5ee;
    --amber: #9a6608;
    --amber-bg: #fdf3e0;
    --red: #b4232f;
    --red-bg: #fdeaec;
    --blue: #2f6fd0;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .proto-banner {
    background: #2b3038; color: #dfe3e8; padding: 7px 16px;
    font-size: 12px; letter-spacing: .02em;
  }
  .proto-banner b { color: #fff; }
  .shell { display: flex; min-height: calc(100vh - 32px); }

  /* ---------- barra lateral ---------- */
  aside {
    width: 232px; flex: 0 0 232px; background: var(--surface);
    border-right: 1px solid var(--line); padding: 18px 0;
    display: flex; flex-direction: column;
  }
  .brand { font-weight: 600; font-size: 15px; padding: 0 18px 16px; }
  nav a {
    display: block; padding: 8px 18px; color: var(--text-2);
    text-decoration: none; border-left: 2px solid transparent; cursor: pointer;
  }
  nav a:hover { background: var(--line-soft); color: var(--text); }
  .navgrupo {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--text-3); padding: 14px 10px 4px; font-weight: 600;
  }
  .navgrupo:first-child { padding-top: 2px; }
  nav a.on {
    color: var(--text); font-weight: 600;
    border-left-color: var(--accent); background: var(--line-soft);
  }
  .side-foot {
    margin-top: auto; padding: 14px 18px 0; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--text-2); line-height: 1.7;
  }
  .side-foot b { color: var(--text); font-weight: 600; }

  /* ---------- estructura ---------- */
  main { flex: 1; padding: 22px 28px 60px; max-width: 1080px; }
  h1 { font-size: 20px; margin: 0 0 2px; font-weight: 600; }
  h2 { font-size: 15px; margin: 26px 0 10px; font-weight: 600; }
  h3 { font-size: 13px; margin: 0 0 8px; font-weight: 600; color: var(--text-2);
       text-transform: uppercase; letter-spacing: .05em; }
  .sub { color: var(--text-2); margin: 0 0 18px; max-width: 70ch; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .spread { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }

  /* ---------- metricas ---------- */
  .stats { display: flex; gap: 26px; flex-wrap: wrap; }
  .stat .v { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12px; color: var(--text-3); }
  .hero .v { font-size: 32px; line-height: 1.1; font-weight: 600; font-variant-numeric: tabular-nums; }
  .hero .l { font-size: 12px; color: var(--text-3); margin-bottom: 2px; }
  .hero .n { font-size: 12px; color: var(--text-2); margin-top: 3px; }
  .ok { color: var(--green); } .warn { color: var(--amber); } .bad { color: var(--red); }

  /* ---------- barra de macros ---------- */
  .macrobar { display: flex; height: 9px; border-radius: 5px; overflow: hidden; background: var(--line); }
  .macrobar span { display: block; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-top: 7px; }
  .legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; }

  /* ---------- controles ---------- */
  button, select {
    font: inherit; border: 1px solid var(--line); background: var(--surface);
    color: var(--text); border-radius: 6px; padding: 6px 11px; cursor: pointer;
  }
  button:hover { background: var(--line-soft); border-color: #cfd4da; }
  .combo { font-weight: 500; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); border-radius: 20px;
    padding: 4px 11px; font-size: 12.5px; cursor: pointer; color: var(--text-2);
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on { background: #eaf1fb; border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chip small { color: var(--text-3); margin-left: 3px; }
  .chip.on small { color: var(--accent); }
  .ghost { border-color: transparent; background: transparent; color: var(--text-3); padding: 2px 6px; }
  .ghost:hover { color: var(--red); background: var(--red-bg); }
  button:disabled, input:disabled { opacity: .5; cursor: not-allowed; }
  button:disabled:hover { border-color: var(--line); color: var(--text-2); }
  .datenav { display: flex; align-items: center; gap: 10px; }
  .datenav .d { font-weight: 600; min-width: 270px; }
  input[type=search], input[type=number], input[type=date], input[type=text] {
    font: inherit; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--surface); color: var(--text); width: 100%;
  }

  /* ---------- tablas ---------- */
  table { width: 100%; border-collapse: collapse; }
  .framed { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
  th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
       color: var(--text-3); font-weight: 600; padding: 9px 12px; background: #fafbfc;
       border-bottom: 1px solid var(--line); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--line-soft); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  .num { text-align: right; }
  .grp td { background: #fafbfc; font-weight: 600; font-size: 12.5px; }
  .muted { color: var(--text-3); }
  .dash { color: var(--text-3); }

  /* ---------- avisos ---------- */
  .note { border-radius: 7px; padding: 11px 13px; font-size: 13px; border: 1px solid; }
  .note.ok { background: var(--green-bg); border-color: #c3e3d1; color: #17503a; }
  .note.bad { background: var(--red-bg); border-color: #f3ccd1; color: #7d1b24; }
  .note.info { background: #eef4fc; border-color: #cfdff6; color: #1d477f; }
  .note.plain { background: #fafbfc; border-color: var(--line); color: var(--text-2); }
  .note b { display: block; margin-bottom: 3px; }
  .formula { font-family: var(--mono); font-size: 12.5px; color: var(--text-2); line-height: 1.9; }

  .hide { display: none !important; }
  svg text { font-size: 10px; fill: var(--text-3); }
</style>
</head>

<div class="proto-banner">
  <b>Prototipo no funcional</b> · mockup para acordar el diseño de kcal-tracker. Nada se guarda: al recargar vuelve al estado inicial.

</div>

// ---- Reglas de negocio (RN-01 a RN-06 del documento de requerimientos) ----
const KCAL_GRASA = 7700, KCAL_MUSCULO = 1500;
const FACTOR = 1.2;

// La medicion mas reciente es la referencia. Todo lo derivado se recalcula
// cuando se agrega, edita o elimina una medicion (RF-D8).
let ACTUAL, MAGRA, GRASA_KG, BMR, GASTO_BASE;
function recalcular() {
  MEDICIONES.sort((a, b) => a.f.localeCompare(b.f));
  ACTUAL     = MEDICIONES[MEDICIONES.length - 1];
  MAGRA      = ACTUAL.peso * (1 - ACTUAL.gp / 100);              // 59.78 kg
  GRASA_KG   = ACTUAL.peso * (ACTUAL.gp / 100);                  // 12.42 kg
  BMR        = 370 + 21.6 * MAGRA;                               // RN-01
  GASTO_BASE = BMR * FACTOR;                                     // RN-02
}
recalcular();

function plan(objPct, semanas) {
  const pesoObj  = MAGRA / (1 - objPct / 100);
  const grasaObj = pesoObj - MAGRA;
  const aPerder  = GRASA_KG - grasaObj;
  const kcal     = aPerder * KCAL_GRASA;
  const diario   = kcal / (semanas * 7);
  const techo    = Math.min(GASTO_BASE * 0.25, ACTUAL.peso * 0.0075 * KCAL_GRASA / 7); // RN-05
  return { pesoObj, grasaObj, aPerder, kcal, diario, techo, seguro: diario <= techo };
}
function calibracion() {                                          // RN-06
  const a = MEDICIONES[1], b = ACTUAL;
  const dias = Math.round((new Date(b.f) - new Date(a.f)) / 864e5);
  const dGrasa = a.peso * a.gp / 100 - b.peso * b.gp / 100;
  const dMusc  = b.peso * b.mp / 100 - a.peso * a.mp / 100;
  const energia = dGrasa * KCAL_GRASA - dMusc * KCAL_MUSCULO;
  return { dias, dGrasa, dMusc, energia, diario: energia / dias,
           desde: a.f, hasta: b.f, diasConRegistro: 10 };
}

// Dia sintetico determinista, solo para el modo de simulacion del prototipo.
// Permite ver como se comporta el contraste de RN-11 con cobertura alta.
function diaSimulado(f) {
  const semilla = [...f].reduce((s, c) => s + c.charCodeAt(0), 0);
  const r = (semilla * 9301 + 49297) % 233280 / 233280;
  const dow = new Date(f).getDay();
  const entrena = dow !== 0 && dow !== 3 && r > 0.25;
  const act = entrena ? [290, 310, 330, 390][semilla % 4] : 0;
  const ingesta = Math.round(1612 + r * 420 + (dow === 6 ? 380 : 0));
  return { f, ingesta, act, p: Math.round(ingesta * 0.24 / 4), c: Math.round(ingesta * 0.42 / 4),
           g: Math.round(ingesta * 0.30 / 9), afuera: dow === 6 && r > 0.6 ? 700 : 0, sim: true };
}

const conRSim = serie => serie.filter(d => d.registro && d.sim && d.act > 0);

// RN-11 — metricas de periodo. Solo cuenta dias con registro.
function metricasPeriodo(desde, hasta, objDiario, simular) {
  const dias = [];
  for (let d = new Date(desde); d <= new Date(hasta); d.setDate(d.getDate() + 1))
    dias.push(d.toISOString().slice(0, 10));

  const serie = dias.map(f => {
    const r = DIAS.find(x => x.f === f) || (simular ? diaSimulado(f) : null);
    if (!r) return { f, registro: false };
    const gasto = GASTO_BASE + r.act;
    return { f, registro: true, ...r, gasto, deficit: gasto - r.ingesta };
  });
  const conR = serie.filter(d => d.registro);
  const n = conR.length || 1;

  const acumulado = conR.reduce((s, d) => s + d.deficit, 0);
  const sesiones = SESIONES.filter(s => dias.includes(s.f));
  const porTipo = {};
  for (const s of sesiones) {
    const t = ACTIVIDADES.find(a => a.id === s.act)?.tipo || "otro";
    porTipo[t] = porTipo[t] || { n:0, kcal:0 };
    porTipo[t].n++; porTipo[t].kcal += s.kcal;
  }
  // Los dias simulados no tienen sesiones en SESIONES: se agregan por su kcal de actividad.
  for (const d of conRSim(serie)) {
    porTipo.gym = porTipo.gym || { n:0, kcal:0 };
    porTipo.gym.n++; porTipo.gym.kcal += d.act;
  }

  const kcalTotales = conR.reduce((s,d) => s + d.ingesta, 0) || 1;
  const kcalAfuera  = conR.reduce((s,d) => s + d.afuera, 0);

  const medsEnRango = MEDICIONES.filter(m => m.f >= desde && m.f <= hasta);
  let grasaMedida = null;
  if (medsEnRango.length >= 2) {
    const p = medsEnRango[0], u = medsEnRango[medsEnRango.length - 1];
    grasaMedida = p.peso * p.gp / 100 - u.peso * u.gp / 100;
  }

  return {
    serie, diasTotales: dias.length, diasConRegistro: conR.length,
    cobertura: conR.length / dias.length,
    acumulado, medio: acumulado / n,
    adherencia: conR.filter(d => d.deficit >= objDiario).length,
    ingestaMedia: kcalTotales / n,
    pMedia: conR.reduce((s,d) => s + d.p, 0) / n,
    cMedia: conR.reduce((s,d) => s + d.c, 0) / n,
    gMedia: conR.reduce((s,d) => s + d.g, 0) / n,
    pctAfuera: kcalAfuera / kcalTotales,
    diasAfuera: conR.filter(d => d.afuera > 0).length,
    sesiones, porTipo,
    diasSinActividad: conR.filter(d => d.act === 0).length,
    grasaEstimada: acumulado / KCAL_GRASA,
    grasaMedida, medsEnRango,
  };
}

function vistaGym() {
  const [rid, di] = (S.sesionDia || "r1:0").split(":");
  const R = RUTINAS.find(r => r.id === rid) || RUTINAS[0];
  const D = R.dias[+di] || R.dias[0];

  // Ultima sesion de cada ejercicio, para la columna de contexto (RF-K2).
  const ultima = id => {
    const hist = SESIONES_GYM.filter(s => s.ejs.some(x => x.e === id))
                             .sort((a,b) => a.f.localeCompare(b.f));
    if (!hist.length) return null;
    const s = hist[hist.length-1];
    return { ...s.ejs.find(x => x.e === id), f:s.f };
  };
  const actCat = ACTIVIDADES.find(a => a.n.startsWith(D.n.slice(0, 5)));
  const solapa = actCat && S.acts.includes(actCat.id);

  // Progresion del ejercicio seleccionado (RF-K5).
  const sel = S.ejSel || D.ejs[0].e;
  const serie = SESIONES_GYM.filter(s => s.ejs.some(x => x.e === sel && x.peso != null))
    .map(s => ({ f:s.f, peso:s.ejs.find(x => x.e === sel).peso }))
    .sort((a,b) => a.f.localeCompare(b.f));

  let grafico = `<div class="note plain">Todavía no hay sesiones registradas con
    ${esc(ejById(sel)?.n || sel)}, así que no hay progresión que mostrar.</div>`;
  if (serie.length >= 2) {
    const W=620, H=190, PAD=40;
    const lo = Math.min(...serie.map(p=>p.peso)) - 3, hi = Math.max(...serie.map(p=>p.peso)) + 3;
    const t0 = new Date(serie[0].f).getTime();
    const span = (new Date(serie[serie.length-1].f).getTime() - t0) || 1;
    const X = f => PAD + (new Date(f).getTime() - t0) / span * (W - PAD - 26);
    const Y = v => H - 26 - (v - lo) / ((hi - lo)||1) * (H - 52);
    const d0 = serie[0], dn = serie[serie.length-1];
    grafico = `
    <svg width="${W}" height="${H}" style="max-width:100%">
      <path d="${serie.map((p,i)=>`${i?"L":"M"}${X(p.f).toFixed(1)},${Y(p.peso).toFixed(1)}`).join(" ")}"
            fill="none" stroke="#2f6fd0" stroke-width="2"/>
      ${serie.map(p => `<circle cx="${X(p.f).toFixed(1)}" cy="${Y(p.peso).toFixed(1)}" r="3"
        fill="#2f6fd0"><title>${p.f} · ${f1(p.peso)} kg</title></circle>`).join("")}
      <text x="4" y="${(Y(hi-3)+4).toFixed(1)}">${f1(hi-3)} kg</text>
      <text x="4" y="${(Y(lo+3)+4).toFixed(1)}">${f1(lo+3)} kg</text>
      <text x="${PAD}" y="${H-6}">${d0.f}</text>
      <text x="${W-26}" y="${H-6}" text-anchor="end">${dn.f}</text>
    </svg>
    <p class="muted" style="font-size:12.5px;margin:4px 0 0">De ${f1(d0.peso)} a ${f1(dn.peso)} kg ·
      <span class="ok">+${((dn.peso/d0.peso-1)*100).toFixed(1)} %</span> en ${serie.length} sesiones.</p>`;
  }

  return `
  <div class="row" style="justify-content:space-between">
    <h1>Sesión de gym</h1>
    <div class="row">
      ${R.dias.map((d,i) => `<button class="chip ${+di===i?"on":""}" data-sesiondia="${R.id}:${i}">
        ${esc(d.n.split("—")[0].trim())}</button>`).join("")}
    </div>
  </div>
  <p class="sub">${esc(R.n)} · ${esc(D.n)} · precargado desde la rutina.
  Cambiá solo lo que hiciste distinto.</p>

  <div class="framed" style="margin-bottom:14px">
    <table>
      <thead><tr><th>Ejercicio</th><th>Rutina dice</th><th class="num">Series</th>
      <th class="num">Reps</th><th class="num">Peso</th><th class="num">Últ. vez</th><th></th></tr></thead>
      <tbody>${D.ejs.map(x => {
        const e = ejById(x.e), u = ultima(x.e);
        const cmp = u && x.peso != null && u.peso != null
          ? (x.peso > u.peso ? '<span class="ok">▲</span>'
            : x.peso < u.peso ? '<span class="bad">▼</span>' : '<span class="muted">=</span>') : "";
        return `<tr style="${x.e===sel?"background:#f2f6fc":""}">
          <td><a href="#" data-ejsel="${x.e}" style="color:inherit;text-decoration:none;border-bottom:1px dotted #b9c0c9">${esc(e?.n||x.e)}</a></td>
          <td class="muted" style="font-size:12.5px">${fmtSerie(x)} · ${x.peso!=null?f1(x.peso)+" kg":esc(x.obs||"—")}</td>
          <td class="num"><input type="number" value="${x.s}" style="width:52px"></td>
          <td class="num"><input type="number" value="${x.rMin}" style="width:52px"></td>
          <td class="num">${x.peso!=null
            ? `<input type="number" step="0.5" value="${x.peso}" style="width:74px"> ${cmp}`
            : `<input type="text" value="${esc(x.obs||"")}" style="width:120px">`}</td>
          <td class="num muted">${u ? (u.peso!=null?f1(u.peso)+" kg":"—") : "primera"}</td>
          <td class="num muted" style="font-size:11.5px">${u?u.f.slice(5):""}</td></tr>`;
      }).join("")}</tbody>
    </table>
  </div>

  <div class="row" style="margin-bottom:10px">
    <button class="chip" style="cursor:default">+ Ejercicio fuera de la rutina</button>
    <button class="chip" style="cursor:default">▸ Detallar serie por serie</button>
  </div>

  <div class="row" style="margin-bottom:12px">
    <label class="muted" style="width:150px">kcal de la sesión</label>
    <input type="number" value="${actCat ? actCat.kcal : 330}" style="width:100px">
    <span class="muted" style="font-size:12px">
      ${actCat ? `del catálogo "${esc(actCat.n)}", editable` : "editable"}</span>
  </div>

  ${solapa ? `<div class="note bad">
    <b>Posible doble conteo</b>
    Hoy ya marcaste la actividad "${esc(actCat.n)}" de ${actCat.kcal} kcal en la pantalla Hoy.
    Si guardás esta sesión con kcal, se contarían dos veces. Es el mismo error que la planilla
    comete con el ejercicio (P-03).
  </div>` : ""}

  <div class="row" style="margin-bottom:22px">
    <button class="chip" style="cursor:default">Cancelar</button>
    <button style="border-color:#2f6fd0;color:#2f6fd0">Guardar sesión</button>
  </div>

  <h2>Progresión — ${esc(ejById(sel)?.n || sel)}</h2>
  <p class="sub">Clic en cualquier ejercicio de la tabla para ver el suyo.</p>
  ${grafico}`;
}

function vistaCardio() {
  const durProt = p => p.bloques.reduce((t,b) => t + b.min * b.rep, 0);
  const kcalDe = s => s.kcal != null ? s.kcal : (s.kMin + s.kMax) / 2;

  const conParam = SESIONES_CARDIO.filter(s => s.vel != null)
                                  .sort((a,b) => a.f.localeCompare(b.f));
  let grafico = `<div class="note plain">Hacen falta al menos dos sesiones con velocidad
    registrada para ver la progresión.</div>`;
  if (conParam.length >= 2) {
    const W=660, H=200, PAD=42;
    const vLo = Math.min(...conParam.map(s=>s.vel)) - .3, vHi = Math.max(...conParam.map(s=>s.vel)) + .3;
    const iLo = Math.min(...conParam.map(s=>s.inc)) - 1,  iHi = Math.max(...conParam.map(s=>s.inc)) + 1;
    const t0 = new Date(conParam[0].f).getTime();
    const span = (new Date(conParam[conParam.length-1].f).getTime() - t0) || 1;
    const X = f => PAD + (new Date(f).getTime() - t0) / span * (W - PAD - 46);
    const Yv = v => H - 26 - (v - vLo) / ((vHi-vLo)||1) * (H - 52);
    const Yi = v => H - 26 - (v - iLo) / ((iHi-iLo)||1) * (H - 52);
    const linea = (acc, Y) => conParam.map((s,i) =>
      `${i?"L":"M"}${X(s.f).toFixed(1)},${Y(acc(s)).toFixed(1)}`).join(" ");
    grafico = `
    <svg width="${W}" height="${H}" style="max-width:100%">
      <path d="${linea(s=>s.vel, Yv)}" fill="none" stroke="#2f6fd0" stroke-width="2"/>
      <path d="${linea(s=>s.inc, Yi)}" fill="none" stroke="#c8912a" stroke-width="2" stroke-dasharray="4 3"/>
      ${conParam.map(s => `
        <circle cx="${X(s.f).toFixed(1)}" cy="${Yv(s.vel).toFixed(1)}" r="3" fill="#2f6fd0"><title>${s.f} · ${f1(s.vel)} km/h</title></circle>
        <circle cx="${X(s.f).toFixed(1)}" cy="${Yi(s.inc).toFixed(1)}" r="3" fill="#c8912a"><title>${s.f} · ${s.inc} %</title></circle>`).join("")}
      <text x="4" y="14" fill="#2f6fd0">km/h</text>
      <text x="${W-40}" y="14" fill="#c8912a">% incl.</text>
      <text x="${PAD}" y="${H-6}">${conParam[0].f}</text>
      <text x="${W-46}" y="${H-6}" text-anchor="end">${conParam[conParam.length-1].f}</text>
    </svg>
    <div class="legend">
      <span><i style="background:#2f6fd0"></i>velocidad: ${f1(conParam[0].vel)} → ${f1(conParam[conParam.length-1].vel)} km/h</span>
      <span><i style="background:#c8912a"></i>inclinación: ${conParam[0].inc} → ${conParam[conParam.length-1].inc} %</span>
    </div>`;
  }

  return `
  <div class="row" style="justify-content:space-between">
    <h1>Cardio</h1>
    <div class="row">
      <button class="chip" style="cursor:default">+ Sesión</button>
      <button class="chip" style="cursor:default">+ Protocolo</button>
    </div>
  </div>
  <p class="sub">La planilla copia un bloque por semana, así que la progresión solo se ve leyendo
  hacia abajo. Acá velocidad e inclinación son una serie temporal.</p>

  ${grafico}

  <h2>Sesiones</h2>
  <div class="framed">
    <table>
      <thead><tr><th>Fecha</th><th>Tipo</th><th class="num">Min</th><th class="num">Vel</th>
      <th class="num">Incl</th><th class="num">kcal</th><th>Protocolo</th><th></th></tr></thead>
      <tbody>${[...SESIONES_CARDIO].reverse().map(s => `<tr>
        <td>${s.f}</td>
        <td class="muted">${s.prot ? "intervalos" : "continuo"}</td>
        <td class="num">${s.min}</td>
        <td class="num">${s.vel!=null?f1(s.vel):'<span class="dash">var.</span>'}</td>
        <td class="num">${s.inc!=null?s.inc+" %":'<span class="dash">var.</span>'}</td>
        <td class="num">${f0(kcalDe(s))}${s.kcal==null
          ? ` <span class="muted" style="font-size:11.5px">(${s.kMin}-${s.kMax})</span>` : ""}</td>
        <td class="muted">${s.prot ? esc(PROTOCOLOS.find(p=>p.id===s.prot).n) : "—"}</td>
        <td class="num" style="white-space:nowrap">
          <button class="ghost" title="Editar">✎</button>
          <button class="ghost" title="Eliminar">🗑</button></td></tr>`).join("")}
      </tbody>
    </table>
  </div>
  <p class="muted" style="font-size:12.5px">Cuando cargás las kcal como rango, el gasto del día usa
  el punto medio y el rango queda a la vista. Sumar intervalos obligaría a propagar la incertidumbre
  por todo el sistema, para una precisión que la estimación de partida no tiene (RN-14).</p>

  <h2>Protocolos de intervalos</h2>
  ${PROTOCOLOS.map(p => `
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <div><b>${esc(p.n)}</b> <span class="muted">· ${f0(durProt(p))} min · ${esc(p.desc)}</span></div>
        <div class="row"><button class="chip" style="cursor:default">Registrar</button>
        <button class="ghost" title="Editar">✎</button></div>
      </div>
      <table>
        <thead><tr><th class="num">#</th><th>Bloque</th><th class="num">Min</th>
        <th class="num">Vel</th><th class="num">Incl</th><th class="num">Repite</th></tr></thead>
        <tbody>${p.bloques.map((b, i) => `<tr>
          <td class="num muted">${i+1}</td><td>${esc(b.n)}</td>
          <td class="num">${b.min}</td><td class="num">${f1(b.vel)}</td>
          <td class="num">${b.inc} %</td><td class="num">×${b.rep}</td></tr>`).join("")}
        </tbody>
      </table>
      <div class="formula" style="margin-top:8px">
        duración = ${p.bloques.map(b => `${b.min}${b.rep>1?"×"+b.rep:""}`).join(" + ")}
        = <b>${f0(durProt(p))} min</b>
      </div>
    </div>`).join("")}`;
}

const PERIODOS = {
  semana: { t:"Semana",   desde:"2026-09-10", hasta:"2026-09-16", label:"10 al 16 de septiembre de 2026" },
  mes:    { t:"Mes",      desde:"2026-09-01", hasta:"2026-09-30", label:"septiembre de 2026" },
  d90:    { t:"90 días",  desde:"2026-06-19", hasta:"2026-09-16", label:"últimos 90 días" },
  cal:    { t:"19 ago – 15 sep", desde:"2026-08-19", hasta:"2026-09-15",
            label:"19 de agosto al 15 de septiembre — el rango entre dos mediciones" },
};

function vistaDashboard() {
  const P = PERIODOS[S.periodo];
  const objDiario = plan(S.objPct, S.semanas).diario;
  const M = metricasPeriodo(P.desde, P.hasta, objDiario, S.simular);

  // ---- grafico de deficit por dia ----
  const W = 700, H = 210, PAD = 46, BASE = H - 34;
  const vals = M.serie.filter(d => d.registro).map(d => d.deficit);
  const top = Math.max(600, ...vals), bot = Math.min(-200, ...vals);
  const esc_ = v => v / (top - bot) * (H - 60);
  const y0 = BASE - esc_(-bot);
  const bw = Math.max(3, Math.min(22, (W - PAD - 16) / M.serie.length - 3));
  const bx = i => PAD + i * (W - PAD - 16) / M.serie.length;

  const barras = M.serie.map((d, i) => {
    if (!d.registro)
      return `<rect x="${bx(i).toFixed(1)}" y="${y0 - 3}" width="${bw}" height="3"
                fill="#d3d8de"><title>${d.f} · sin registro</title></rect>`;
    const h = Math.abs(esc_(d.deficit));
    const y = d.deficit >= 0 ? y0 - h : y0;
    const col = d.deficit >= objDiario ? "#1d7a4f" : d.deficit >= 0 ? "#c8912a" : "#b4232f";
    return `<rect x="${bx(i).toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${Math.max(1,h).toFixed(1)}"
              fill="${col}" rx="1"><title>${d.f} · ${f0(d.deficit)} kcal · ingesta ${f0(d.ingesta)} · gasto ${f0(d.gasto)}</title></rect>`;
  }).join("");

  const mostrarContraste = M.cobertura >= 0.5 && M.grasaMedida !== null;
  const disc = mostrarContraste ? M.grasaEstimada - M.grasaMedida : null;

  // ---- progreso hacia el objetivo, desde el punto de partida de marzo ----
  const grasaInicio = MEDICIONES[1].peso * MEDICIONES[1].gp / 100;   // 16.11 kg
  const objetivoKg  = plan(S.objPct, S.semanas).grasaObj;
  const totalPerder = grasaInicio - objetivoKg;
  const yaPerdido   = grasaInicio - GRASA_KG;
  const pctProg     = Math.min(100, yaPerdido / totalPerder * 100);

  return `
  <div class="row" style="justify-content:space-between;margin-bottom:4px">
    <h1>Dashboard</h1>
    <div class="row">
      ${Object.entries(PERIODOS).map(([k,v]) =>
        `<button class="chip ${k===S.periodo?"on":""}" data-per="${k}">${v.t}</button>`).join("")}
      <button class="chip" style="cursor:default" title="En la app permite elegir un rango libre">Rango…</button>
    </div>
  </div>
  <div class="row" style="justify-content:space-between;align-items:flex-start">
    <p class="sub" style="margin:0 0 14px">${P.label}</p>
    <label class="muted" style="font-size:12px;white-space:nowrap">
      <input type="checkbox" id="simular" ${S.simular?"checked":""}>
      rellenar los días sin registro con datos simulados
    </label>
  </div>
  ${S.simular ? `<div class="note info" style="margin-bottom:16px">
    <b>Modo simulación</b>
    Los días que no están en tu planilla se rellenaron con valores plausibles, solo para poder ver
    cómo se comporta la pantalla con cobertura alta. Los 10 días reales del 7 al 16 de septiembre
    se mantienen intactos.
  </div>` : ""}

  <div class="stats" style="margin-bottom:22px">
    <div class="stat"><div class="v ${M.acumulado>=0?"ok":"bad"}">${f0(M.acumulado)}</div>
      <div class="l">Déficit acumulado (kcal)</div></div>
    <div class="stat"><div class="v">${f0(M.medio)}</div>
      <div class="l">Déficit medio por día</div></div>
    <div class="stat"><div class="v ${M.cobertura>=.7?"ok":M.cobertura>=.5?"warn":"bad"}">${M.diasConRegistro} / ${M.diasTotales}</div>
      <div class="l">Cobertura · ${Math.round(M.cobertura*100)} %</div></div>
    <div class="stat"><div class="v">${M.adherencia} / ${M.diasConRegistro}</div>
      <div class="l">Días que alcanzaron ${f0(objDiario)} kcal</div></div>
  </div>

  <h3>Déficit por día</h3>
  <svg width="${W}" height="${H}" style="max-width:100%">
    <line x1="${PAD}" y1="${y0}" x2="${W-16}" y2="${y0}" stroke="#c9ced5"/>
    <line x1="${PAD}" y1="${(y0-esc_(objDiario)).toFixed(1)}" x2="${W-16}" y2="${(y0-esc_(objDiario)).toFixed(1)}"
          stroke="#1d7a4f" stroke-dasharray="4 3"/>
    <text x="${PAD-4}" y="${(y0-esc_(objDiario)+3).toFixed(1)}" text-anchor="end" fill="#1d7a4f">${f0(objDiario)}</text>
    <text x="${PAD-4}" y="${y0+3}" text-anchor="end">0</text>
    ${barras}
    <text x="${PAD}" y="${H-8}">${M.serie[0].f.slice(8)} set</text>
    <text x="${W-16}" y="${H-8}" text-anchor="end">${M.serie[M.serie.length-1].f.slice(8)} set</text>
  </svg>
  <div class="legend" style="margin-bottom:6px">
    <span><i style="background:#1d7a4f"></i>alcanzó el objetivo</span>
    <span><i style="background:#c8912a"></i>déficit insuficiente</span>
    <span><i style="background:#b4232f"></i>superávit</span>
    <span><i style="background:#d3d8de"></i>sin registro</span>
  </div>
  <p class="muted" style="font-size:12.5px;margin:0 0 4px">
    Pasá el mouse por cada barra para ver el detalle. Los días sin registro no son días de cero:
    quedan fuera del acumulado y de los promedios.
  </p>

  <div class="cols" style="margin-top:22px">
    <div>
      <h3>Promedios diarios</h3>
      <div class="framed"><table><tbody>
        <tr><td>Ingesta</td><td class="num">${f0(M.ingestaMedia)} kcal</td></tr>
        <tr><td>Proteína</td><td class="num">${f0(M.pMedia)} g</td></tr>
        <tr><td>Carbohidratos</td><td class="num">${f0(M.cMedia)} g</td></tr>
        <tr><td>Grasa</td><td class="num">${f0(M.gMedia)} g</td></tr>
        <tr><td>Comida de afuera</td>
            <td class="num">${M.diasAfuera} días · ${Math.round(M.pctAfuera*100)} % de las kcal</td></tr>
      </tbody></table></div>
    </div>
    <div>
      <h3>Entrenamiento</h3>
      <div class="framed"><table><tbody>
        ${["gym","cardio","deporte"].map(t => {
          const x = M.porTipo[t];
          return `<tr><td>${t.charAt(0).toUpperCase()+t.slice(1)}</td>
            <td class="num">${x ? x.n + (x.n===1?" sesión":" sesiones") : "—"}</td>
            <td class="num">${x ? f0(x.kcal)+" kcal" : ""}</td></tr>`;
        }).join("")}
        <tr><td>Días sin ninguna actividad</td>
            <td class="num">${M.diasSinActividad}</td><td class="num">de ${M.diasConRegistro}</td></tr>
      </tbody></table></div>
    </div>
  </div>

  <h2>¿Coincide el registro con la báscula?</h2>
  <div class="card">
    <div class="formula" style="margin-bottom:10px">
      grasa perdida estimada por el déficit registrado = ${f0(M.acumulado)} / 7700 =
      <b>${f2(M.grasaEstimada)} kg</b><br>
      grasa perdida medida entre las mediciones del período =
      <b>${M.grasaMedida !== null ? f2(M.grasaMedida)+" kg" : "no hay dos mediciones en el rango"}</b>
    </div>
    ${mostrarContraste ? `
      <div class="note ${Math.abs(disc) < 0.15 ? "ok" : "bad"}">
        <b>Discrepancia ${disc>=0?"+":""}${f2(disc)} kg</b>
        ${Math.abs(disc) < 0.15
          ? "El modelo está calibrado: lo que registrás explica lo que marca la báscula."
          : disc > 0
            ? "Estás perdiendo menos de lo que el registro predice. Lo más probable es que las porciones estén subestimadas o el gasto sobreestimado."
            : "Estás perdiendo más de lo previsto. Vale revisar que parte de eso no sea masa magra."}
      </div>`
    : `<div class="note bad">
        <b>No se puede comparar todavía</b>

// RN-10 — la validacion es aritmetica y no depende de confiar en la fuente.
function validar(r) {
  if (r.p === null) return { desvio:null, nivel:"sin macros" };
  const calc = r.p * 4 + r.c * 4 + r.g * 9;
  const desvio = Math.abs(calc - r.kcal) / r.kcal;
  return { calc, desvio,
           nivel: desvio <= 0.05 ? "ok" : desvio <= 0.15 ? "aviso" : "malo" };
}

function render() {

    ? `<div class="navgrupo">${esc(s.g)}</div>`

  document.getElementById("main").innerHTML = VISTAS[S.seccion]();

const SEL = "[data-sec],[data-combo],[data-add],[data-act],[data-quitar],[data-vaciar]," +
            "[data-per],[data-editact],[data-cancelact],[data-guardaract],[data-borraract]," +
            "[data-editmed],[data-cancelmed],[data-guardarmed],[data-pedirborrarmed]," +
            "[data-borrarmed],[data-iabuscar],[data-iausar]," +
            "[data-rutina],[data-sesiondia],[data-entrenar],[data-ejsel]";

document.addEventListener("click", e => {
  const t = e.target.closest(SEL);
  if (!t) return;
  const d = t.dataset;
  const val = id => document.getElementById(id)?.value;

  if (d.sec)   { S.seccion = d.sec; S.busqueda = "";
                 S.editAct = S.editMed = S.borrarMed = S.avisoRef = null; }
  if (d.per)   { S.periodo = d.per; }
  if (d.combo) {
    const c = COMBOS.find(x => x.id === d.combo);
    S.comidas[c.tipo] = [...(S.comidas[c.tipo] || []), ...c.items];
  }
  if (d.add)   { S.comidas[S.tipoActivo] = [...(S.comidas[S.tipoActivo] || []), d.add]; }
  if (d.act)   { S.acts = S.acts.includes(d.act) ? S.acts.filter(x => x !== d.act) : [...S.acts, d.act]; }
  if (d.quitar) {
    const [tipo, i] = d.quitar.split(":");
    S.comidas[tipo] = S.comidas[tipo].filter((_, j) => j !== +i);
  }
  if (d.vaciar) { S.comidas = {}; }

  // ---- gym ----
  if (d.rutina)    { S.rutina = d.rutina; }
  if (d.sesiondia) { S.sesionDia = d.sesiondia; S.ejSel = null; }
  if (d.entrenar)  { S.sesionDia = d.entrenar; S.ejSel = null; S.seccion = "gym"; }
  if (d.ejsel)     { e.preventDefault(); S.ejSel = d.ejsel; }

  // ---- catalogo de actividades ----
  if (d.editact)   { S.editAct = d.editact; }
  if (d.cancelact) { S.editAct = null; }
  if (d.guardaract) {
    const datos = { n: val("actN") || "Actividad sin nombre", tipo: val("actT"),
                    kcal: +val("actK") || 0, min: +val("actM") || null };
    if (d.guardaract === "nueva") {
      ACTIVIDADES.push({ id: "a" + Date.now(), ...datos });
    } else {
      Object.assign(ACTIVIDADES.find(x => x.id === d.guardaract), datos);
    }
    S.editAct = null;
  }
  if (d.borraract) {
    const i = ACTIVIDADES.findIndex(x => x.id === d.borraract);
    if (i >= 0) ACTIVIDADES.splice(i, 1);
    S.acts = S.acts.filter(x => x !== d.borraract);
    S.editAct = null;
  }

  // ---- mediciones ----
  if (d.editmed)        { S.editMed = d.editmed; S.borrarMed = null; }
  if (d.cancelmed)      { S.editMed = null; S.borrarMed = null; }
  if (d.pedirborrarmed) { S.borrarMed = d.pedirborrarmed; S.editMed = null; }
  if (d.borrarmed) {
    const i = MEDICIONES.findIndex(x => x.f === d.borrarmed);
    if (i >= 0) MEDICIONES.splice(i, 1);
    S.borrarMed = null;
    recalcularReferencia();
  }
  if (d.guardarmed) {
    const datos = { f: val("medF"), peso: +val("medP"), gp: +val("medG"),
                    mp: +val("medM"), v: +val("medV") };
    if (d.guardarmed === "nueva") {
      const dup = MEDICIONES.find(x => x.f === datos.f);
      if (dup) Object.assign(dup, datos); else MEDICIONES.push(datos);
    } else {
      Object.assign(MEDICIONES.find(x => x.f === d.guardarmed), datos);
    }
    MEDICIONES.sort((a, b) => a.f.localeCompare(b.f));
    S.editMed = null;
    recalcularReferencia();
  }

  // ---- busqueda asistida ----
  if (d.iabuscar) {
    const q = (S.iaTexto || "").trim().toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    const key = Object.keys(IA_MOCK).find(k => k.includes(q) || q.includes(k));
    S.iaResultados = q ? (key ? IA_MOCK[key] : []) : null;
  }
  if (d.iausar) {
    const r = S.iaResultados[+d.iausar];
    ALIMENTOS.push({ id:"n"+Date.now(), n:r.n, porc:r.porc, kcal:r.kcal,
                     p:r.p, c:r.c, g:r.g, origen:r.fuente });
    CAT.push(ALIMENTOS[ALIMENTOS.length-1]);
    S.iaResultados = null; S.iaTexto = "";
  }
  render();
});

function recalcularReferencia() {
  if (!MEDICIONES.length) return;
  const bmrAnterior = BMR, refAnterior = ACTUAL.f;
  recalcular();
  S.avisoRef = (refAnterior !== ACTUAL.f || Math.abs(bmrAnterior - BMR) > 0.5)
    ? `Referencia: medición del ${ACTUAL.f}. El gasto basal pasó de ${f0(bmrAnterior)} a ${f0(BMR)} kcal, `
      + `y el plan de objetivo se recalculó.`
    : null;
}

document.addEventListener("change", e => {
  if (e.target.id === "tipoActivo") { S.tipoActivo = e.target.value; render(); }
  if (e.target.id === "objPct")     { S.objPct = +e.target.value; render(); }
  if (e.target.id === "semanas")    { S.semanas = +e.target.value; render(); }
  if (e.target.id === "simOffline") { S.sinConexion = e.target.checked; S.iaResultados = null; render(); }
  if (e.target.id === "simular")    { S.simular = e.target.checked; render(); }
});

document.addEventListener("input", e => {
  const id = e.target.id;
  if (id !== "busqueda" && id !== "iaTexto") return;
  if (id === "busqueda") S.busqueda = e.target.value; else S.iaTexto = e.target.value;
  const pos = e.target.selectionStart;
  render();
  const el = document.getElementById(id);
  if (el) { el.focus(); el.setSelectionRange(pos, pos); }
});

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "iaTexto") {
    document.querySelector("[data-iabuscar]")?.click();
  }
});

render();
</script>
</body>
</html>
